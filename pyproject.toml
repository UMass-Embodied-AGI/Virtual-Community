[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
genesis-world = { git = "https://github.com/UMass-Embodied-AGI/Genesis.git", rev = "cdbe596f23220b8134434dd0946039c4f493ab5a" }
torch = [
    { index = "pytorch-cu117", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu117", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu117", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true
